server {
    listen 80;
    server_name localhost;

    # Only the public/ folder is visible to the browser.
    # src/, .env, Docker files etc. can never be downloaded.
    root /var/www/html/public;
    index index.php;

    location / {
        try_files $uri $uri/ =404;
    }

    # Every .php request is passed to the "app" container on port 9000
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Block hidden files like .env or .git, just in case
    location ~ /\. {
        deny all;
    }
}