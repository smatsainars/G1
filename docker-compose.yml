services:

  web:
    image: nginx:1.28-alpine
    ports:
      - "8080:80"                 # browser opens localhost:8080
    volumes:
      - ./public:/var/www/html/public:ro                          # only public/, read-only
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  app:
    build: .                      # built from our Dockerfile
    volumes:
      - .:/var/www/html           # code on my PC = code in the container
    environment:                  # values come from the .env file
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy   # wait until MySQL is really ready
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql    # data survives container restarts
    healthcheck:                  # asks MySQL "are you alive?" every 5s
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    # no "ports:" - the database is only reachable inside Docker

volumes:
  db_data: